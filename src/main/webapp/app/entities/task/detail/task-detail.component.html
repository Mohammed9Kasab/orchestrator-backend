<div class="d-flex justify-content-center">
  <div class="col-8">
    <div *ngIf="task">
      <h2 data-cy="taskDetailsHeading"><span jhiTranslate="orchestratorApp.task.detail.title">Task</span></h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ task.id }}</span>
        </dd>
        <dt><span jhiTranslate="orchestratorApp.task.duration">Duration</span></dt>
        <dd>
          <span>{{ task.duration }}</span>
        </dd>
        <dt><span jhiTranslate="orchestratorApp.task.job">Job</span></dt>
        <dd>
          <div *ngIf="task.job">
            <a [routerLink]="['/job', task.job.id, 'view']">{{ task.job.id }}</a>
          </div>
        </dd>
        <dt><span jhiTranslate="orchestratorApp.task.worker">Worker</span></dt>
        <dd>
          <div *ngIf="task.worker">
            <a [routerLink]="['/worker', task.worker.id, 'view']">{{ task.worker.id }}</a>
          </div>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/task', task.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
  </div>
</div>
